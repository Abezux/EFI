name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d efi_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/listener/requirements.txt

      - name: Run Python Lint (ruff & black)
        run: |
          ruff check services/listener/
          black --check services/listener/

      - name: Run Python Tests (pytest)
        run: |
          pytest services/listener/tests/

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m
        continue-on-error: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Database Migrations
        env:
          PGPASSWORD: postgres
        run: |
          echo "Applying migrations to test PostgreSQL database..."
          psql -h localhost -p 5432 -U postgres -d efi_dev -v ON_ERROR_STOP=1 -f db/migrations/0001_init.sql
          
          if [ -f db/migrations/0002_seed_channels.sql ]; then
            echo "Applying 0002_seed_channels.sql..."
            psql -h localhost -p 5432 -U postgres -d efi_dev -v ON_ERROR_STOP=1 -f db/migrations/0002_seed_channels.sql
          fi
          
          echo "Verifying schema tables and app role permissions..."
          psql -h localhost -p 5432 -U postgres -d efi_dev -v ON_ERROR_STOP=1 -c "\dt"
          
          echo "Testing connection and permissions with least-privilege app role (efi_app)..."
          PGPASSWORD=efi_app_pass psql -h localhost -p 5432 -U efi_app -d efi_dev -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM channels; SELECT count(*) FROM raw_posts;"

      - name: Run Go Unit Tests
        run: go test -v ./...

      - name: Run Python Fixture Validation
        run: python3 tests/validate_fixtures.py
