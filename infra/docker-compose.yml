services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: efi_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-efi_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-efi_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  listener:
    build:
      context: ..
      dockerfile: services/listener/Dockerfile
    container_name: efi_listener
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_DATABASE_URL: postgres://efi_app:efi_app_pass@postgres:5432/efi_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  processor:
    build:
      context: ../services/processor
      dockerfile: Dockerfile
    container_name: efi_processor
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_DATABASE_URL: postgres://efi_app:efi_app_pass@postgres:5432/efi_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: efi_api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      API_DATABASE_URL: postgres://efi_api:efi_api_pass@postgres:5432/efi_dev?sslmode=disable
      ADMIN_DATABASE_URL: postgres://efi_admin:efi_admin_pass@postgres:5432/efi_dev?sslmode=disable
      API_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: efi_web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      INTERNAL_API_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
    driver: local


